[project]
name = "polymarket_history"
dynamic = ["version"]
authors = [
    {name = "andreyfesunov", email = "fsnv04@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "typer (>=0.19.0,<1.0.0)",
    "pycryptodome (>=3.23.0,<4.0.0)",
    "psycopg[binary] (>=3.2.0,<4.0.0)",
]

[project.scripts]
polymarket-history = "polymarket_history.main:main"
polymarket-history-init = "polymarket_history_initializer.migrate:main"

[tool.poetry]
packages = [
    { include = "polymarket_history" },
    { include = "polymarket_history_initializer" },
]
version = "0.0.0"

[tool.poetry-dynamic-versioning]
enable = true

[tool.poetry-dynamic-versioning.from-file]
source = "VERSION"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[dependency-groups]
dev = [
    "ruff (>=0.16.8,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["polymarket_history", "polymarket_history_initializer"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["polymarket_history", "polymarket_history_initializer"]
explicit_package_bases = true
warn_unreachable = true
